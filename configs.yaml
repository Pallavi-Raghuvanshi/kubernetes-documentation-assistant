# configs.yaml
corpus:
  name: kubernetes
  source_type: html

ingestion:
  timeout_seconds: 30

chunking:
  chunk_size: 512
  chunk_overlap: 128

retrieval:
  default_retriever: dense  # bm25, dense
  top_k: 20

generation:
  model_name: qwen2.5-1.5b-instruct
  max_new_tokens: 200

evaluation:
  mode: both              # retrieval or both
  num_queries: 0          # Set to 0 to evaluate all queries
  version_name: dense_both_base        
  commit_changes: true   # to test temporary code change

  metrics:
    retrieval:
      - recall_at_k
      - precision_at_k
      - mrr
      - hit_rate_at_k

    generation:
      - faithfulness
      - answer_completeness
      - hallucination_rate
      - sentence_integrity
