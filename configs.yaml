# configs.yaml
corpus:
  name: kubernetes
  source_type: html

ingestion:
  timeout_seconds: 30

chunking:
  chunk_size: 512
  chunk_overlap: 26
  parent_child:
    parent_size: 256
    parent_overlap: 20
    parent_top_k: 20   # Number of unique parent chunks returned
    child_size: 96
    child_overlap: 12
    child_top_k: 40    # Number of child chunks retrieved before parent mapping

vector_store:
  provider: chroma
  similarity_search: ip
  batch_size: 500

retrieval:
  retriever: parent_child  # bm25, dense, hybrid, parent_child
  model: models/kubernetes_updated_minilm_initialized  # sentence-transformers/all-MiniLM-L6-v2 , models/kubernetes_updated_minilm_initialized
  top_k: 20
  candidate_k: 100  # chunks to be extracted from both sparse & dense retieval for hybrid retrieval
  rrf_k: 60
  rerank: false   # true/false

generation:
  run_generation: false
  model_name: qwen2.5-1.5b-instruct
  max_new_tokens: 200

evaluation:
  mode: retrieval              # retrieval or both
  num_queries: 77          # 0:150 (for multiple) or 150 (single)
  version_name: parent_child_upd_eval     
  save_result: false

  metrics:
    retrieval:
      - sequence_coverage
      - hit_rate_at_k
      - mrr

    generation:
      - faithfulness
      - answer_completeness
      - hallucination_rate
      - sentence_integrity
