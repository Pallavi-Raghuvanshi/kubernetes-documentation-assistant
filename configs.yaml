# configs.yaml
corpus:
  name: kubernetes
  source_type: html

ingestion:
  timeout_seconds: 30

chunking:
  chunk_size: 512
  chunk_overlap: 128

retrieval:
  retriever: bm25  # bm25, dense, hybrid
  model: sentence-transformers/all-MiniLM-L6-v2 # dense
  top_k: 20
  candidate_k: 100  # chunks to be extracted from both sparse & dense retieval for hybrid retrieval
  rrf_k: 60
  rerank: false   # true/false

generation:
  model_name: qwen2.5-1.5b-instruct
  max_new_tokens: 200

evaluation:
  mode: retrieval              # retrieval or both
  num_queries: 0          # Set to 0 to evaluate all queries
  version_name: sparse_ret_no_rerank        
  commit_changes: false   # to test temporary code change: true/false

  metrics:
    retrieval:
      - recall_at_k
      - precision_at_k
      - mrr
      - hit_rate_at_k

    generation:
      - faithfulness
      - answer_completeness
      - hallucination_rate
      - sentence_integrity
