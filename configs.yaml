# configs.yaml
corpus:
  name: kubernetes
  source_type: html

ingestion:
  timeout_seconds: 30

chunking:
  chunk_size: 512
  chunk_overlap: 128

retrieval:
  default_retriever: bm25
  top_k: 10

generation:
  model_name: qwen2.5-1.5b-instruct
  max_new_tokens: 160

evaluation:
  mode: both           # retrieval, generation, or both
  num_queries: 0        # Set to 0 to evaluate all queries
  commit_changes: true  # to test temporary code change
  version_name: v2_chunk_level_ret_eval
