- query_id: Q005
  query: "How do Kubernetes local volumes differ from hostPath volumes, and what availability risks do local volumes introduce?"
  answer: "A local volume represents a mounted local storage device, such as a disk, partition, or directory, and can only be used with a statically created PersistentVolume because dynamic provisioning is unsupported. Compared with hostPath volumes, local volumes provide a more durable and portable approach without manually scheduling Pods to nodes because Kubernetes uses node affinity on the PersistentVolume. However, if the underlying node becomes unhealthy, the volume may become inaccessible and the Pod may be unable to run. Applications must tolerate reduced availability and possible data loss."
  relevant_chunks:
    - kubernetes_26570
    - kubernetes_26571
    - kubernetes_26572

