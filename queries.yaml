- query_id: Q001
  query: "How do Kubernetes API server logs help diagnose API Priority and Fairness request handling?"
  answer: "At verbosity level -v=3 or higher, the API server logs an httplog line for each request. The log can include the flow schema and priority level assigned to the request, the number of seats allocated for the initial and final execution stages, and the additional latency of the final stage."
