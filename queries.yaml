- query_id: Q002
  query: "Why must Kubernetes custom resource validation rules use schema paths that can be correlated between old and new objects?"
  answer: "A transition rule must resolve to a schema node that can be compared between old and new objects. List items and their descendants may not be reliably correlated across updates. Placing a transition rule on an uncorrelatable schema portion can make the rule impossible to apply and cause errors when writing the CustomResourceDefinition."
